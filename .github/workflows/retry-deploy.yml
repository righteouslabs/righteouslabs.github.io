name: Retry failed deploy

# Re-runs "Deploy to GitHub Pages" when it fails from transient GitHub outages
# (e.g. "Failed to resolve action download info: Service Unavailable", which kills
# the job during "Set up job" before any step-level retry could run).
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    # ponytail: no `uses:` here on purpose — this job must not depend on the same
    # action-download service that takes the deploy workflow down.
    steps:
      - name: Wait out the outage, then re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh run rerun ${{ github.event.workflow_run.id }} --failed \
            --repo ${{ github.repository }}
